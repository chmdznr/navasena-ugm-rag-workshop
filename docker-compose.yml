# Workshop RAG Navasena x UGM
#   docker compose up --build        -> basis data, ingest, aplikasi web, API, JupyterLab
#   docker compose --profile docling run --rm docling    -> parsing ulang PDF dengan Docling
#   docker compose --profile uji run --rm promptfoo      -> uji keamanan dengan promptfoo
#   docker compose --profile service up --build          -> layanan RAG berbasis LlamaIndex (port 8080)

x-workshop: &workshop
  build: .
  image: navasena-rag-workshop:latest
  environment:
    DATABASE_URL: postgresql://rag:rag@db:5432/rag
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-openrouter/free}
    LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
    GUARD_MODEL: ${GUARD_MODEL:-}
  volumes:
    - ./:/workshop

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Sekali jalan: potong dokumen, hitung embedding, simpan ke pgvector.
  ingest:
    <<: *workshop
    command: python scripts/ingest.py
    depends_on:
      db:
        condition: service_healthy

  # Aplikasi web: http://localhost:8501
  app:
    <<: *workshop
    command: streamlit run app/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      ingest:
        condition: service_completed_successfully

  # API untuk diuji promptfoo: http://localhost:8000/docs
  api:
    <<: *workshop
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ingest:
        condition: service_completed_successfully

  # JupyterLab untuk notebook latihan: http://localhost:8888
  lab:
    <<: *workshop
    command: >
      jupyter lab --ip 0.0.0.0 --port 8888 --no-browser --allow-root
      --IdentityProvider.token='' --ServerApp.root_dir=/workshop/notebooks
    ports:
      - "127.0.0.1:8888:8888"
    depends_on:
      ingest:
        condition: service_completed_successfully

  # Opsional: unduh PDF dari arXiv lalu ubah menjadi Markdown dengan Docling.
  docling:
    profiles: ["docling"]
    build:
      context: .
      dockerfile: Dockerfile.docling
    image: navasena-rag-docling:latest
    command: sh -c "python scripts/download_papers.py && python scripts/parse_docling.py"
    volumes:
      - ./:/workshop

  # Opsional: uji keamanan pipeline lewat API.
  promptfoo:
    profiles: ["uji"]
    image: ghcr.io/promptfoo/promptfoo:latest
    working_dir: /workshop/uji
    entrypoint: ["promptfoo"]
    command: ["eval", "-c", "promptfooconfig.yaml", "--no-cache", "-j", "1"]
    environment:
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
    volumes:
      - ./uji:/workshop/uji
    depends_on:
      - api

  # --- Versi framework (LlamaIndex) yang disusun seperti layanan production ---------------
  # Job ingest dipisah dari layanan API, dan keduanya memakai image yang sama.
  service-ingest:
    profiles: ["service"]
    build: &service-build
      context: .
      dockerfile: service/Dockerfile
    image: navasena-rag-service:latest
    command: python -m service.app.ingest
    environment: &service-env
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openrouter/free}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      GUARD_MODEL: ${GUARD_MODEL:-}
      GUARD_LEVEL: ${GUARD_LEVEL:-rules}
      SERVICE_API_KEYS: ${SERVICE_API_KEYS:-kunci-publik-demo:public,kunci-internal-demo:internal}
    depends_on:
      db:
        condition: service_healthy

  # API: http://localhost:8080/docs
  service:
    profiles: ["service"]
    build: *service-build
    image: navasena-rag-service:latest
    environment: *service-env
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true            # sistem berkas container tidak bisa ditulisi
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    depends_on:
      service-ingest:
        condition: service_completed_successfully

volumes:
  pgdata:
